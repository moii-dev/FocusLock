<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StayActive</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-8 9-8 9S4 17 4 12V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M3 3 21 21M10 5c5-1 9 4 11 7a17 17 0 0 1-3 4M6 6c-2 2-4 4-5 6 3 5 7 7 11 7 2 0 3 0 5-1"/><path d="M9 9a4 4 0 0 0 6 6"/></symbol>
    <symbol id="window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M7 7h.01M11 7h.01"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="code" viewBox="0 0 24 24"><path d="m7 7-5 5 5 5m10-10 5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="reload" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 14-2l1 6M4 12l1 6a8 8 0 0 0 14-2"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  </svg>
  <main>
    <header>
      <div class="brand-mark"><svg><use href="#shield"/></svg></div>
      <div><h1>StayActive</h1><p>A little focus, preserved.</p></div>
    </header>
    <section class="site" aria-label="Current site">
      <p class="eyebrow">Current site</p>
      <p id="domain" title="Current domain">Loading…</p>
    </section>
    <label class="master">
      <span><strong>Stay active on this site</strong><small id="mode">Off for this domain</small></span>
      <input id="enabled" type="checkbox" role="switch" disabled><span class="switch" aria-hidden="true"></span>
    </label>
    <fieldset id="settings" disabled>
      <legend class="sr-only">Site settings</legend>
      <label class="row">
        <svg><use href="#eye"/></svg><span class="copy"><strong>Hide tab visibility</strong><small>Keep the page visibly present</small></span>
        <input id="hideVisibility" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row">
        <svg><use href="#window"/></svg><span class="copy"><strong>Prevent blur detection</strong><small>Protect window focus signals</small></span>
        <input id="preventBlur" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row timer-row">
        <svg><use href="#clock"/></svg><span class="copy"><strong>Keep timers accurate</strong><small>Recover missed interval ticks</small></span>
        <input id="keepTimers" type="checkbox" role="switch" aria-describedby="timer-note"><span class="switch" aria-hidden="true"></span>
      </label>
      <p id="timer-note">Best effort. Chrome may still pause background tabs.</p>
      <label class="row developer">
        <svg><use href="#code"/></svg><span class="copy"><strong>Developer diagnostics</strong><small>Log events in the page console</small></span>
        <input id="diagnostics" type="checkbox" role="switch"><span class="switch" aria-hidden="true"></span>
      </label>
    </fieldset>
    <p id="notice" role="status" aria-live="polite">Loading site settings…</p>
    <footer><span><svg><use href="#check"/></svg><small id="saved">Stored per domain</small></span>
      <button id="reload" type="button" disabled><svg><use href="#reload"/></svg>Reload tab</button>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
